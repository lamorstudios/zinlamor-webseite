name: fetch-video
on:
  push:
    branches: [tmp-video-fetch]
    paths: [".github/workflows/fetch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q gdown
      - name: Download
        run: |
          mkdir -p out
          ID=1zRgh_IgIS6JD5OdO3Grz_MdVMcOmUXYJ
          curl -sSL -o src.mp4 "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t" || true
          file src.mp4 | tee out/download.txt
          if ! file src.mp4 | grep -qiE "MP4|ISO Media|QuickTime"; then
            head -c 3000 src.mp4 | sed 's/<[^>]*>/ /g' | tr -s ' ' | head -c 1500 >> out/download.txt || true
            gdown --fuzzy "https://drive.google.com/file/d/$ID/view" -O src.mp4 >> out/download.txt 2>&1 || true
            file src.mp4 >> out/download.txt
          fi
          ls -la src.mp4 >> out/download.txt
      - name: Inspect + compress
        continue-on-error: true
        run: |
          mkdir -p out
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,width,height,r_frame_rate -of compact src.mp4 | tee out/info.txt
          ffmpeg -v error -y -i src.mp4 -vf "scale='if(gt(iw,ih),min(1280,iw),-2)':'if(gt(iw,ih),-2,min(1280,ih))':flags=lanczos" -an -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p -movflags +faststart out/zinlamor-image.mp4
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 src.mp4)
          for i in 1 2 3 4 5 6 7 8; do ffmpeg -v error -y -ss $(python3 -c "print($D*$i/9)") -i src.mp4 -frames:v 1 -vf scale=480:-2 out/f$i.jpg; done
          ls -la out
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add out && git commit -m "video output" && git push
