# ──────────────────────────────────────────────────────────────
# SPA-FALLBACK mit Rate Limiting (Pro-Plan, 5 Regeln max.)
#
# Zweck: Fängt alle übrigen Requests ab.
# Rate Limit: 200 Requests / 60 Sekunden pro IP.
# Normale Besucher: laden typisch 10-30 Assets — nie betroffen.
# Suchmaschinen: Googlebot crawlt sehr langsam (~1 Req/s) — nie betroffen.
# Aggressive Scanner: senden hunderte Requests/Minute — werden gebremst.
#
# aggregate_by ["ip", "domain"]: Per-IP-Limit (Pro-Plan-Feature).
# "domain"-only wäre Enterprise-only — daher nicht verwendet.
#
# Routing-Sicherheit: Diese Regel existierte bereits als SPA-Fallback.
# Der einzige Unterschied ist das hinzugefügte [redirects.rate_limit].
# Bestehende Bot-Blocking-Redirects (force=true) haben Vorrang.
# ──────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

  [redirects.rate_limit]
    window_limit   = 200
    window_size    = 60
    aggregate_by   = ["ip", "domain"]

# ══════════════════════════════════════════════════════════════
# CACHE HEADERS
# HTML: no-cache — Netlify invalidiert ETags bei Deploy automatisch.
# Kein Stale-Content nach Deployment möglich.
# Statische Assets: 1 Jahr immutable.
# ══════════════════════════════════════════════════════════════

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control           = "public, no-cache"
    X-Content-Type-Options  = "nosniff"
    X-Frame-Options         = "SAMEORIGIN"
    Referrer-Policy         = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
