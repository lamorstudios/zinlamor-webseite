# ══════════════════════════════════════════════════════════════
# ZINLAMOR Studios — netlify.toml
# Bot-Blocking, Cache-Headers, Rate Limiting (Pro-Plan)
# Zuletzt geprüft gegen Netlify-Dokumentation: Sep 2026
# ══════════════════════════════════════════════════════════════

[build]
  publish = "."

# ══════════════════════════════════════════════════════════════
# REDIRECTS — Scanner/Bot-Pfade mit 404 abweisen
